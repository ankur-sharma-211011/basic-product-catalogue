<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Product Store</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
    header { background: #243b53; color: white; padding: 22px max(5%, calc((100% - 1100px)/2)); }
    header h1 { margin: 0 0 6px; font-size: 25px; }
    header p { margin: 0; color: #d9e2ec; }
    main { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    input, select { padding: 11px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 14px; background: white; }
    input { flex: 1; min-width: 200px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #e1e5e9; border-radius: 9px; padding: 18px; }
    .picture { height: 105px; display: grid; place-items: center; background: #eaf0f6; border-radius: 7px; font-size: 40px; margin-bottom: 14px; }
    .card h3 { margin: 4px 0 8px; font-size: 17px; }
    .category { color: #627d98; font-size: 13px; }
    .price { font-size: 19px; font-weight: bold; margin: 12px 0; }
    button { border: 0; background: #2563a6; color: white; padding: 10px 14px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #174b80; }
    .empty { background: white; padding: 25px; border-radius: 8px; text-align: center; grid-column: 1/-1; }
    dialog { border: 0; border-radius: 10px; width: min(480px, calc(100% - 30px)); padding: 24px; box-shadow: 0 10px 40px #0003; }
    dialog::backdrop { background: #14253699; }
    .close { background: #64748b; float: right; }
    footer { text-align: center; color: #627d98; padding: 25px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Simple Product Store</h1>
    <p>A small product catalogue built with FastAPI and SQLite</p>
  </header>
  <main>
    <div class="filters">
      <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
      <select id="category" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>
    </div>
    <section id="products" class="grid"><p>Loading products...</p></section>
  </main>
  <dialog id="details">
    <button class="close" onclick="document.getElementById('details').close()">Close</button>
    <div id="details-content"></div>
  </dialog>
  <footer>Demo catalogue · Product data stored in a local SQLite database</footer>
  <script>
    const productsArea = document.getElementById("products");
    const searchBox = document.getElementById("search");
    const categoryBox = document.getElementById("category");
    const dialog = document.getElementById("details");

    async function loadCategories() {
      const response = await fetch("/api/categories");
      const categories = await response.json();
      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryBox.appendChild(option);
      });
    }

    async function loadProducts() {
      const params = new URLSearchParams({
        search: searchBox.value,
        category: categoryBox.value
      });
      const response = await fetch("/api/products?" + params);
      const products = await response.json();
      productsArea.innerHTML = "";

      if (products.length === 0) {
        productsArea.innerHTML = '<p class="empty">No products found.</p>';
        return;
      }

      products.forEach(product => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="picture">🛍️</div>
          <div class="category">${product.category}</div>
          <h3>${product.name}</h3>
          <div class="price">₹${Number(product.price).toLocaleString("en-IN")}</div>
          <button type="button" data-id="${product.id}">View details</button>
        `;
        card.querySelector("button").addEventListener("click", () => showDetails(product.id));
        productsArea.appendChild(card);
      });
    }

    async function showDetails(id) {
      const response = await fetch("/api/products/" + id);
      if (!response.ok) return;
      const product = await response.json();
      document.getElementById("details-content").innerHTML = `
        <h2>${product.name}</h2>
        <p><strong>Category:</strong> ${product.category}</p>
        <p><strong>Price:</strong> ₹${Number(product.price).toLocaleString("en-IN")}</p>
        <p><strong>Available stock:</strong> ${product.stock}</p>
        <p>${product.description}</p>
      `;
      dialog.showModal();
    }

    searchBox.addEventListener("input", loadProducts);
    categoryBox.addEventListener("change", loadProducts);
    loadCategories().then(loadProducts);
  </script>
</body>
</html>
