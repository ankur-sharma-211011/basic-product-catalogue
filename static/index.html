<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Product Store</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Simple Product Store</h1>
      <p>A small product catalogue built with FastAPI and SQLite</p>
    </header>

    <main>
      <section class="appearance">
        <h2>Customize appearance</h2>

        <div class="appearance-controls">
          <label>
            Theme
            <select id="theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="warm">Warm</option>
            </select>
          </label>

          <label>
            Accent color
            <input type="color" id="accent" value="#2563a6" />
          </label>

          <label>
            Font size
            <select id="fontSize">
              <option value="14px">Small</option>
              <option value="16px" selected>Medium</option>
              <option value="18px">Large</option>
            </select>
          </label>

          <label>
            Card corners
            <select id="cardRadius">
              <option value="0px">Square</option>
              <option value="9px" selected>Rounded</option>
              <option value="20px">Very rounded</option>
            </select>
          </label>

          <button id="resetAppearance" class="reset-button">Reset</button>
        </div>
      </section>

      <div class="filters">
        <input
          id="search"
          type="search"
          placeholder="Search products..."
          aria-label="Search products"
        />

        <select id="category" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
      </div>

      <section id="products" class="grid">
        <p>Loading products...</p>
      </section>
    </main>

    <dialog id="details">
      <button class="close" id="closeDetails">Close</button>
      <div id="details-content"></div>
    </dialog>

    <footer>
      <span>Demo catalogue · SQLite database</span>
      <a href="/admin">Admin page</a>
    </footer>
  </body>
</html>
